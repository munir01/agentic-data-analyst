name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall api.py mcp_server.py src/

  build-and-push:
    needs: test

    # Only publish images after a real push to main.
    # Pull requests only run the test job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::638869575937:role/GitHubActionsOlistAgent
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Download database from S3
        run: |
          mkdir -p db
          aws s3 cp \
            s3://munir-agentic-data-analyst-638869575937/data/olist.db \
            db/olist.db

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ARM64 Docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t 638869575937.dkr.ecr.us-east-1.amazonaws.com/olist-agent:latest \
            -t 638869575937.dkr.ecr.us-east-1.amazonaws.com/olist-agent:${{ github.sha }} \
            --push \
            .